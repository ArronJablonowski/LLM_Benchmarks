name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development tools
        run: python -m pip install --upgrade pytest ruff mypy
      - name: Run offline tests
        run: python -m pytest -q
      - name: Lint Python
        run: python -m ruff check scripts dashboard tests
      - name: Type-check the component registry
        run: python -m mypy
